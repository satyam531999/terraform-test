name: Terraform CI CD

on:
  push:
    branches:
      - main
      - feature/**
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - "**/*.hcl"
      - ".github/workflows/terraform.yml"
  pull_request:
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - "**/*.hcl"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Choose pipeline action"
        required: true
        type: choice
        options:
          - plan
          - apply
      target_env:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - prod
      confirm_apply:
        description: "Type apply-dev or apply-prod to confirm apply"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: 1.7.5

jobs:
  ci_checks:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    name: CI Validate and Plan (${{ matrix.env_dir }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env_dir: ["environments/dev", "environments/prod"]

    defaults:
      run:
        working-directory: ${{ matrix.env_dir }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Fmt Check
        working-directory: .
        run: terraform fmt -check -recursive .

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan (Static Validation)
        run: terraform plan -lock=false -input=false -refresh=false -var-file=terraform.tfvars.example -out=tfplan

      - name: Export Plan Text
        run: terraform show -no-color tfplan > tfplan.txt

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ matrix.env_dir }}-tfplan
          path: ${{ matrix.env_dir }}/tfplan.txt

  security_scan:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    name: Security Scan (tfsec)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: .

  manual_plan:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'plan'
    name: Manual Plan (${{ inputs.target_env }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_env }}
    defaults:
      run:
        working-directory: environments/${{ inputs.target_env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Generate backend.hcl
        run: |
          cat > backend.hcl << EOF
          bucket         = "${{ secrets.TF_STATE_BUCKET }}"
          key            = "terraform/aws-prod-lab/${{ inputs.target_env }}/terraform.tfstate"
          region         = "${{ secrets.AWS_REGION }}"
          dynamodb_table = "${{ secrets.TF_LOCK_TABLE }}"
          encrypt        = true
          EOF

      - name: Terraform Init (Remote Backend)
        run: terraform init -backend-config=backend.hcl -reconfigure

      - name: Terraform Plan (Remote State)
        run: terraform plan -input=false -out=tfplan

      - name: Export Plan Text
        run: terraform show -no-color tfplan > tfplan.txt

      - name: Upload Manual Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: manual-${{ inputs.target_env }}-tfplan
          path: environments/${{ inputs.target_env }}/tfplan.txt

  manual_apply:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply' && inputs.confirm_apply == format('apply-{0}', inputs.target_env)
    name: Manual Apply (${{ inputs.target_env }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_env }}
    defaults:
      run:
        working-directory: environments/${{ inputs.target_env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Generate backend.hcl
        run: |
          cat > backend.hcl << EOF
          bucket         = "${{ secrets.TF_STATE_BUCKET }}"
          key            = "terraform/aws-prod-lab/${{ inputs.target_env }}/terraform.tfstate"
          region         = "${{ secrets.AWS_REGION }}"
          dynamodb_table = "${{ secrets.TF_LOCK_TABLE }}"
          encrypt        = true
          EOF

      - name: Terraform Init (Remote Backend)
        run: terraform init -backend-config=backend.hcl -reconfigure

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Export Applied Plan Text
        run: terraform show -no-color tfplan > applied-plan.txt

      - name: Upload Apply Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apply-${{ inputs.target_env }}-plan
          path: environments/${{ inputs.target_env }}/applied-plan.txt
